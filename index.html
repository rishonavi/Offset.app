<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1828" />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Offset" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Offset</title>
    <script>
      // Apply the saved theme and accent before paint to avoid a flash. The
      // accent shades are duplicated from src/lib/appearance.js on purpose:
      // this has to run before any module loads, and a wrong colour for one
      // frame is exactly what someone who chose a colour would notice.
      try {
        var t = localStorage.getItem('pl_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        var hues = { gold: 82.35, copper: 42, rose: 15, violet: 310, indigo: 262, emerald: 155 };
        var h = hues[localStorage.getItem('pl_accent')];
        if (h) {
          var s = document.documentElement.style;
          s.setProperty('--color-gold', 'oklch(0.7245 0.0998 ' + h + ')');
          s.setProperty('--color-gold-dark', 'oklch(0.7665 0.1387 ' + h + ')');
          s.setProperty('--color-brand', 'oklch(0.7245 0.0998 ' + h + ')');
          s.setProperty('--color-brand-dark', 'oklch(0.662 0.1071 ' + h + ')');
          s.setProperty('--color-brand-light', 'oklch(0.9533 0.0184 ' + h + ')');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
