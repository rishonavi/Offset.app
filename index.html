<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Kept in step with the chosen tone by lib/appearance.js; this is the
         value before any script runs. -->
    <meta name="theme-color" content="#0d1728" />

    <!-- Installable app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Offset" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Offset</title>
    <script>
      // Apply the saved theme and accent before paint to avoid a flash. The
      // accent shades are duplicated from src/lib/appearance.js on purpose:
      // this has to run before any module loads, and a wrong colour for one
      // frame is exactly what someone who chose a colour would notice.
      try {
        var t = localStorage.getItem('pl_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        // Only the page ground needs to be right before paint — the app is a
        // blank div until React mounts, so this is the one colour anyone can
        // see in that gap. Its lightness and chroma are the ramp's; only the
        // hue and the chroma multiplier come from the chosen tone.
        var hues = { gold: 82.35, copper: 42, rose: 15, violet: 310, indigo: 262, emerald: 155 };
        var tones = { navy: [260, 1], slate: [250, 0.55], graphite: [260, 0.12],
                      forest: [158, 0.95], plum: [320, 0.85], clay: [40, 0.9] };
        var a = localStorage.getItem('pl_accent');
        var h = a && hues[a] !== undefined ? hues[a] : (a && !isNaN(Number(a)) ? Number(a) : null);
        var d = document.documentElement;
        var s = d.style;
        if (h !== null) {
          s.setProperty('--color-gold', 'oklch(0.7245 0.0998 ' + h + ')');
          s.setProperty('--color-gold-dark', 'oklch(0.7665 0.1387 ' + h + ')');
          s.setProperty('--color-brand', 'oklch(0.7245 0.0998 ' + h + ')');
          s.setProperty('--color-brand-dark', 'oklch(0.662 0.1071 ' + h + ')');
          s.setProperty('--color-brand-light', 'oklch(0.9533 0.0184 ' + h + ')');
        }
        // The status bar on a phone and the title bar of an installed window.
        // Hardcoded it announced navy while the app was green — the sort of
        // seam that makes an installed app feel like a web page in a frame.
        var chrome = { navy: '#0d1728', slate: '#101820', graphite: '#161719',
                       forest: '#071c11', plum: '#1e1220', clay: '#24120b' };
        var chosen = localStorage.getItem('pl_tone');
        if (chrome[chosen]) {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', chrome[chosen]);
        }
        var t = tones[chosen];
        if (t) {
          var isDark = document.documentElement.classList.contains('dark');
          var lc = isDark ? [0.1686, 0.0322] : [0.9767, 0.0026];
          s.setProperty('--color-surface-page',
            'oklch(' + lc[0] + ' ' + (lc[1] * t[1]).toFixed(4) + ' ' + t[0] + ')');
        }

        // Accessibility adjustments, before paint. This is lib/a11y.js's
        // applyA11y in twenty lines of ES5, duplicated for the same reason the
        // accent above is: it has to run before any module loads.
        //
        // It matters more here than it does for a colour. Somebody who
        // inverted the page or turned the contrast up did it because the
        // normal one is painful to look at, and applying it after the first
        // paint means showing them exactly the thing they turned off, once per
        // navigation. A frame of the wrong accent is a blemish; a frame of
        // full-brightness white is what this setting exists to prevent.
        var a11y = JSON.parse(localStorage.getItem('pl_a11y') || '{}');
        var fs = [1, 1.15, 1.3, 1.5][a11y.fontSize | 0];
        var lh = [0, 1.6, 1.9, 2.2][a11y.lineHeight | 0];
        var ls = [0, '0.02em', '0.06em', '0.12em'][a11y.letterSpacing | 0];
        var al = [0, 'start', 'center', 'end'][a11y.align | 0];
        var f = [];
        if (a11y.invert) f.push('invert(1) hue-rotate(180deg)');
        if (a11y.grayscale) f.push('grayscale(1)');
        if (a11y.saturation && !a11y.grayscale) f.push('saturate(0.45)');
        if (a11y.contrast) f.push('contrast(' + [0, 1.25, 1.6][a11y.contrast | 0] + ')');
        if (f.length) s.filter = f.join(' ');
        if (fs !== 1) s.setProperty('--a11y-font-scale', String(fs));
        if (lh) { s.setProperty('--a11y-line-height', String(lh)); d.setAttribute('data-a11y-lh', ''); }
        if (ls) { s.setProperty('--a11y-letter-spacing', ls); d.setAttribute('data-a11y-ls', ''); }
        if (al) { s.setProperty('--a11y-align', al); d.setAttribute('data-a11y-align', ''); }
        if (a11y.invert) d.setAttribute('data-a11y-invert', '');
        if (a11y.links) d.setAttribute('data-a11y-links', '');
        if (a11y.dyslexia) d.setAttribute('data-a11y-dyslexia', '');
        if (a11y.cursor) d.setAttribute('data-a11y-cursor', '');
        if (a11y.motion) d.setAttribute('data-a11y-motion', '');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
